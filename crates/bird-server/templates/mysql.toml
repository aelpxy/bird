name = "mysql"
description = "MySQL 8.4 LTS with an app database and user, generated passwords and a persistent volume"
image = "docker.io/library/mysql:8.4"
port = 3306
health = "tcp"
health_timeout = "3m"
connection = "DATABASE_URL"

[[volumes]]
name = "data"
path = "/var/lib/mysql"

[env]
MYSQL_DATABASE = "app"
MYSQL_USER = "app"
MYSQL_PASSWORD = "${{secret}}"
MYSQL_ROOT_PASSWORD = "${{secret}}"
DATABASE_URL = "mysql://${{MYSQL_USER}}:${{MYSQL_PASSWORD}}@{service}.internal:3306/${{MYSQL_DATABASE}}"
