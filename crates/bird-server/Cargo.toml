[package]
name = "bird-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "birdd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
bird-api = { workspace = true, features = ["openapi"] }
bird-core.workspace = true
bird-podman.workspace = true
bird-proxy.workspace = true
bird-store.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
instant-acme.workspace = true
object_store.workspace = true
reqwest.workspace = true
ring.workspace = true
rustix = { workspace = true, features = ["process"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
x509-parser.workspace = true

[dev-dependencies]
rcgen.workspace = true
# talks to an in-process birdd over http in the integration tests
reqwest = { workspace = true, features = ["json"] }

[lints]
workspace = true
