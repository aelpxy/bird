[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", default-features = false }
bird-api = { path = "crates/bird-api" }
bird-core = { path = "crates/bird-core" }
bird-podman = { path = "crates/bird-podman" }
bird-proxy = { path = "crates/bird-proxy" }
bird-store = { path = "crates/bird-store" }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
x509-parser = { version = "0.18", default-features = false }
utoipa = { version = "6", default-features = false, features = ["macros", "uuid"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
indexing_slicing = "warn"
# error variants are documented on the error enums themselves
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
